[package]
name = "eensh"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Fast, deterministic X11 screenshot capture utility designed for software agents"
authors = ["David MacDonald <mindlapse@gmail.com>"]

# Dual-licensed under either MIT or Apache-2.0, at the user's option — the
# arrangement Rust projects conventionally use. `license` is the SPDX
# expression that consumers and packaging tools read.
#
# The two licence texts are in LICENSE-MIT and LICENSE-APACHE, and COPYRIGHT
# states which is which. They are *not* referenced from here: Cargo includes
# every file named `LICENSE*` in the package automatically, and setting
# `license-file` as well would only produce "only one of `license` or
# `license-file` is necessary", since the licence already has a standard SPDX
# expression.
license = "MIT OR Apache-2.0"

# Read by the packaging metadata check, which warns when this is absent.
repository = "https://github.com/eensh-project/eensh"

readme = "README.md"
keywords = ["screenshot", "x11", "agent", "capture", "automation"]
categories = ["command-line-utilities", "multimedia::images"]

# Build the API documentation for the same feature set that ships, and make
# cross-crate links resolve on docs.rs. The crate exposes a library as well as
# the `eensh` binary, so the published documentation is the library reference;
# it is served from docs.rs rather than from a separate `documentation` URL.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `debian/` is excluded from the published crate but is tracked in git: it is
# the Debian packaging, which is built from the source tree rather than from
# the crate. `specs/` and `scripts/` are development material; `www/` is the
# documentation site, which is not part of this package.
exclude = ["debian/", "specs/", "scripts/", "www/", "dist/", "target/"]

[features]
# Gates the `compare_bench` diagnostic binary, which measures raw comparison
# cost at representative frame sizes. It is a development tool rather than part
# of the product, and without this gate `cargo install eensh` would place it in
# the user's PATH alongside the `eensh` command. Run it with
# `cargo run --release --bin compare_bench --features bench`.
bench = []

[[bin]]
name = "compare_bench"
path = "src/bin/compare_bench.rs"
required-features = ["bench"]

[dependencies]
# Command line interface.
clap = { version = "4", features = ["derive"] }

# Stable machine readable output.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64 encoding of already-encoded image bytes.
base64 = "0.22"

# PNG encoding (pure Rust).
png = "0.18"

# JPEG encoding. Only the JPEG codec is enabled so the dependency graph stays
# small and portable; no system libjpeg is required.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# X11 bindings that load libX11 dynamically at runtime. This avoids requiring
# X11 development headers at build time, which matters for portability.
x11-dl = "2"

# Used for `getuid` when falling back to a user-namespaced socket path, and by
# the tests to signal Xvfb so it can clean up after itself.
libc = "0.2"

[dev-dependencies]
# Used by the integration tests to render known content into an Xvfb display.
x11-dl = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
